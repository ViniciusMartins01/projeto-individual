<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moto Project Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      display: flex;
    }

    .sidebar {
      width: 260px;
      height: 100vh;
      background: #111827;
      padding: 30px 20px;
      position: fixed;
      left: 0;
      top: 0;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 40px;
      color: #3b82f6;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu a {
      text-decoration: none;
      color: #cbd5e1;
      padding: 14px;
      border-radius: 10px;
      transition: 0.3s;
      font-weight: bold;
    }

    .menu a:hover {
      background: #1e293b;
      color: white;
    }

    .content {
      margin-left: 260px;
      width: calc(100% - 260px);
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 32px;
    }

    .user {
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #94a3b8;
    }

    .card p {
      font-size: 34px;
      font-weight: bold;
      color: #3b82f6;
    }

    .charts {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .chart-container {
      background: #1e293b;
      padding: 20px;
      border-radius: 20px;
      height: 420px;
    }

    .table-container {
      margin-top: 30px;
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      color: #94a3b8;
    }

    tr:hover {
      background: #273449;
    }

    @media(max-width: 1000px) {
      .charts {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width: 768px) {
      .sidebar {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">
      MotoProject
    </div>

    <div class="menu">
      <a href="#">Dashboard</a>
      <a href="#">Catálogo</a>
      <a href="#">Comparador</a>
      <a href="#">Usuários</a>
      <a href="#">Relatórios</a>
      <a href="#">Sair</a>
    </div>
  </div>

  <div class="content">

    <div class="topbar">
      <h1>Dashboard</h1>

      <div class="user">
        Bem-vindo, Usuário
      </div>
    </div>

    <div class="cards">

      <div class="card">
        <h2>Total de Motos</h2>
        <p id="totalMotos">0</p>
      </div>

      <div class="card">
        <h2>Marcas Cadastradas</h2>
        <p id="totalMarcas">0</p>
      </div>

      <div class="card">
        <h2>Usuários</h2>
        <p id="totalUsuarios">0</p>
      </div>

      <div class="card">
        <h2>Visualizações</h2>
        <p id="totalViews">0</p>
      </div>

    </div>

    <div class="charts">

      <div class="chart-container">
        <canvas id="graficoMotos"></canvas>
      </div>

      <div class="chart-container">
        <canvas id="graficoMarcas"></canvas>
      </div>

    </div>

    <div class="table-container">
      <h2>Últimas motos cadastradas</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Velocidade</th>
          </tr>
        </thead>

        <tbody id="tabelaMotos">

        </tbody>
      </table>
    </div>

  </div>

<script>

async function carregarDashboard() {

  try {

    // EXEMPLO DE API DO WEB-DATA-VIZ

    const resposta = await fetch('/dashboard/listar');
    const dados = await resposta.json();

    // CARDS

    document.getElementById('totalMotos').innerText = dados.totalMotos;
    document.getElementById('totalMarcas').innerText = dados.totalMarcas;
    document.getElementById('totalUsuarios').innerText = dados.totalUsuarios;
    document.getElementById('totalViews').innerText = dados.totalViews;

    // TABELA

    const tabela = document.getElementById('tabelaMotos');
    tabela.innerHTML = '';

    dados.ultimasMotos.forEach(moto => {

      tabela.innerHTML += `
        <tr>
          <td>${moto.id}</td>
          <td>${moto.modelo}</td>
          <td>${moto.marca}</td>
          <td>${moto.velocidade} km/h</td>
        </tr>
      `;

    });

    criarGraficoMotos(dados.graficoMotos);
    criarGraficoMarcas(dados.graficoMarcas);

  } catch(erro) {
    console.log('Erro ao carregar dashboard:', erro);
  }

}

function criarGraficoMotos(dados) {

  const ctx = document.getElementById('graficoMotos');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: dados.labels,
      datasets: [{
        label: 'Visualizações por dia',
        data: dados.valores,
        borderWidth: 3,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });

}

function criarGraficoMarcas(dados) {

  const ctx = document.getElementById('graficoMarcas');

  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: dados.labels,
      datasets: [{
        data: dados.valores,
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });

}

// ATUALIZAÇÃO AUTOMÁTICA

setInterval(() => {
  carregarDashboard();
}, 5000);

carregarDashboard();

</script>

</body>
</html>
