<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./js/alerta.js"></script>
  <script src="./js/sessao.js"></script>
  <title>MotoByte | Cadastro de Marca</title>
  <link rel="icon" href="./assets/icon/icon-black.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./css/dash.css">
  <script src="./js/sessao.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>


  <div class="sidebar">

    <div class="logo">MotoByte</div>

    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cadastrador.html">Cadastrar Motos</a>
      <a href="cadastradorM.html" class="active">Cadastrar Marcas e Categoria</a>
      <a href="avaliacao.html">Avaliar</a>
      <a href="catalogo.html">Catálogo</a>
      <a <button onclick="limparSessao()">Sair</button></a>
    </div>

  </div>

  <div class="content">
    <div class="topbar">
      <h1>Cadastro de Marca e Categoria</h1>
      <div class="user">
        Bem-vindo, <span id="b_usuario"> Usuário</span>
      </div>
    </div>
    <div class="form-container">
      <div class="form-title">
        <h2>Nova Marca</h2>
        <p>Cadastre uma nova marca no catálogo.</p>
      </div>
      <form>
        <div class="form-grid">
          <div class="input-group">
            <label>Nome da marca</label>
            <input id="ipt_nome" type="text" placeholder="Ex: Yamaha">
          </div>
          <div class="input-group">
            <label>Pais de origem</label>
            <input id="ipt_pais" type="number" placeholder="Ex: Alemanha">
          </div>
          <div class="input-group">
            <label>Foto da Marca</label>
            <input type="text" id="ipt_foto" placeholder="Ex: url">
          </div>
          <div class="button-area">
            <button onclick="cadastrar()" type="submit" class="btn">
              Cadastrar Marca
            </button>
          </div>
      </form>
    </div>
  </div>
  <div class="content2">
    <div class="form-container">
      <div class="form-title">
        <h2>Nova Categoria</h2>
        <p>Cadastre uma nova Categoria no catálogo.</p>
      </div>
      <form>
        <div class="form-grid">
          <div class="input-group">
            <label>Nome da Categoria</label>
            <input id="ipt_nome" type="text" placeholder="Ex: Yamaha">
          </div>
          <div class="input-group">
            <label>Descrição</label>
            <input id="ipt_desc" type="text" placeholder="Ex: Categoria focada em trilha">
          </div>
          <div class="button-area">
            <button onclick="cadastrar()" type="submit" class="btn">
              Cadastrar Categoria
            </button>
          </div>
      </form>
    </div>
  </div>

</body>

</html>
  <script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function cadastrar() {
      var id = sessionStorage.ID_USUARIO
      var modelo = ipt_modelo.value;
      var cilindrada = ipt_cilindrada.value;
      var potencia = ipt_potencia.value;
      var torque = ipt_torque.value;
      var velocidadeMax = ipt_velocidadeMax.value;
      var peso = ipt_peso.value;
      var consumo = ipt_consumo.value;
      var foto = ipt_foto.value;
      var marca = ipt_marca.value;
      var categoria = ipt_categoria.value;
      var preco = ipt_preco.value;

      fetch("/motos/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          modeloServer: modelo,
          velocidadeMaxServer: velocidadeMax,
          cilindradaServer: cilindrada,
          potenciaServer: potencia,
          torqueServer: torque,
          pesoServer: peso,
          consumoServer: consumo,
          fotoServer: foto,
          marcaServer: marca,
          categoriaServer: categoria,
          precoServer: preco,
          idServer: id
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);
          setTimeout(() => {
            window.location = "dashboard.html";
          }, "2000");
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          finalizarAguardar();
        });
      return false;
    }
  </script>
