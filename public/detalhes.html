<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Honda CB 500 | MotoByte</title>
<link rel="icon" href="./assets/icon/icon-black.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="./css/estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body onload="carregarDetalhes(sessionStorage.ID_MOTO)">
<header>

  <a href="index.html">
      <div class="logo">MotoByte</div>
    </a>

 <nav>
    <a href="catalogo.html">Catálogo</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html">Login</a>
    <a href="cadastro.html">Cadastro</a>
  </nav>

</header>

<section class="hero">

  <div class="hero-text">

    <span id="span_marca"></span>

    <h1 id="h1_modelo"></h1>

    <p id="p_descricao">
      
    </p>

    <div class="buttons">

      <a onclick="favoritar(sessionStorage.ID_MOTO)" class="btn-primary">
        Adicionar aos favoritos
      </a>

      <a href="dashboard.html" class="btn-secondary">
        Comparar moto
      </a>

    </div>

  </div>

  <div class="hero-image">
    <img src="" id="img_moto" alt="Imagem da moto">
  </div>
  
</section>

<section class="specs">

  <div class="section-title">
    <h2>Especificações <span>Técnicas</span></h2>
  </div>

  <div class="spec-grid">

    <div class="spec-card">
      <h3>Cilindrada</h3>
      <p id="p_cilindrada"></p>
    </div>

    <div class="spec-card">
      <h3>Potência</h3>
      <p id="p_potencia"></p>
    </div>

    <div class="spec-card">
      <h3>Velocidade Máx.</h3>
      <p id="p_velocidadeMax"></p>
    </div>

    <div class="spec-card">
      <h3>Preço Médio</h3>
      <p id="p_preco"></p>
    </div>

  </div>

</section>


<footer>
  © 2026 MotoRadar - Projeto acadêmico ADS
</footer>

</body>
</html>

<script>

  function carregarDetalhes(idMoto) {
    fetch(`/motos/detalhes/${idMoto}`)
        .then(function (response) {
          console.log(response)
          return response.json();
        })
        .then(function (data) {
          console.log(data)
          document.getElementById('span_marca').innerText = data[0].marca;
          document.getElementById('h1_modelo').innerText = data[0].modelo;
          document.getElementById('p_descricao').innerText = `${data[0].descricao}`;
          document.getElementById('img_moto').src = data[0].imagem;
          document.getElementById('p_cilindrada').innerText = `${data[0].cilindrada} cc`;
          document.getElementById('p_potencia').innerText = `${data[0].potencia} cv`;
          document.getElementById('p_velocidadeMax').innerText = `${data[0].velocidadeMax} km/h`;
          document.getElementById('p_preco').innerText = `R$ ${data[0].preco}`;
        })
        .catch(function (error) {
          console.error(`Erro na obtenção dos dados: ${error.message}`);
        });
  }
  function favoritar(idMoto) {

    const idUsuario = sessionStorage.ID_USUARIO;
    
    fetch(`/favoritos/inserir`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            idUsuario: idUsuario,
            idMoto: idMoto
        })
    })
    .then(resposta => {
        if (resposta.ok) {
            alert("Moto adicionada aos favoritos!");
        }
    })
    .catch(erro => {
        console.log(erro);
    });
  }
</script>
