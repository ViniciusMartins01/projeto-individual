<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | MotoByte</title>
  <link rel="icon" href="./assets/icon/icon-black.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/estilo.css">
</head>

<body onload="carregarCatalogo()">
  <header style="position: sticky;">
    <a href="index.html">
      <div class="logo">MotoByte</div>
    </a>
    <nav>
      <a href="catalogo.html">Catálogo</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="login.html">Login</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <section class="title">
    <h1>Nosso <span>Catálogo</span></h1>
    <p>Escolha sua próxima moto</p>
  </section>

  <section class="grid" id="catalogo">
  </section>

<footer>
  <p>© 2026 MotoByte </p>
</footer>

</body>
</html>

<script>

  function escolher(idMoto) {
    sessionStorage.setItem(idMoto, idMoto);
    window.location.href = 'detalhes.html'
  }

  function carregarCatalogo() {
    fetch(`/motos/listar`)
        .then(function (response) {
          console.log(response)
          return response.json();
        })
        .then(function (data) {
          console.log(data)
          for (let i = 0; i < data.length; i++) {
          const moto = data[i];
          document.getElementById('catalogo').innerHTML += `
        <div class="card"><img src="${moto.imagem}">
          <div class="card-content">
            <h3>${moto.modelo}</h3>
          <p>${moto.cilindrada}cc ${moto.categoria}</p><a class="btn" href="${moto.modelo}.html">Ver detalhes</a>
          </div>
        </div>
          `;
         }
        })
        .catch(function (error) {
          console.error(`Erro na obtenção dos dados: ${error.message}`);
        });
  }

</script>
