<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoRadar Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="./assets/icon/icon-black.png">
<link href="./css/dash.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>


<div class="sidebar">

  <div class="logo">
    MotoRadar
  </div>

  <div class="menu">
    <a href="#" class="active">Dashboard</a>
    <a href="#">Catálogo</a>
    <a href="#">Sair</a>
  </div>

</div>


<div class="content">
  <div class="topbar">

    <h1>Dashboard</h1>

    <div class="user">
      Bem-vindo, Usuário
    </div>

  </div>

  <div class="cards">

    <div class="card">
      <h2>Total de Motos</h2>
      <p id="totalMotos">0</p>
    </div>

    <div class="card">
      <h2>Marcas Cadastradas</h2>
      <p id="totalMarcas">0</p>
    </div>

    <div class="card">
      <h2>Usuários</h2>
      <p id="totalUsuarios">0</p>
    </div>

    <div class="card">
      <h2>Visualizações</h2>
      <p id="totalViews">0</p>
    </div>

  </div>

  <div class="charts">

    <div class="chart-container">
      <h3>Visualizações por dia</h3>
      <canvas id="graficoMotos"></canvas>
    </div>

    <div class="chart-container">
      <h3>Marcas populares</h3>
      <canvas id="graficoMarcas"></canvas>
    </div>

  </div>

  <div class="table-container">

    <h2>Últimas motos cadastradas</h2>

    <table>

      <thead>

        <tr>
          <th>ID</th>
          <th>Modelo</th>
          <th>Marca</th>
          <th>Velocidade</th>
        </tr>

      </thead>

      <tbody id="tabelaMotos">

      </tbody>

    </table>

  </div>

</div>

<script>

   let proximaAtualizacao;


async function carregarDashboard() {

  try {

    const resposta = await fetch('/dashboard/listar');
    const dados = await resposta.json();


    document.getElementById('totalMotos').innerText = dados.totalMotos;
    document.getElementById('totalMarcas').innerText = dados.totalMarcas;
    document.getElementById('totalUsuarios').innerText = dados.totalUsuarios;
    document.getElementById('totalViews').innerText = dados.totalViews;

  

    const tabela = document.getElementById('tabelaMotos');

    tabela.innerHTML = '';

    dados.ultimasMotos.forEach(moto => {

      tabela.innerHTML += `
        <tr>
          <td>${moto.id}</td>
          <td>${moto.modelo}</td>
          <td>${moto.marca}</td>
          <td>${moto.velocidade} km/h</td>
        </tr>
      `;

    });

    criarGraficoMotos(dados.graficoMotos);
    criarGraficoMarcas(dados.graficoMarcas);

  } catch(erro) {

    console.log('Erro ao carregar dashboard:', erro);

  }

}


function criarGraficoMotos(dados) {

  const ctx = document.getElementById('graficoMotos');

  new Chart(ctx, {

    type:'line',

    data:{
      labels:dados.labels,

      datasets:[{
        label:'Visualizações',
        data:dados.valores,
        borderColor:'#E10600',
        backgroundColor:'rgba(225,6,0,0.15)',
        borderWidth:3,
        tension:.4,
        fill:true,
        pointBackgroundColor:'#FFFFFF',
        pointBorderColor:'#E10600',
        pointRadius:5
      }]
    },

    options:{
      responsive:true,
      maintainAspectRatio:false,

      plugins:{
        legend:{
          labels:{
            color:'#FFFFFF'
          }
        }
      },

      scales:{

        x:{
          ticks:{
            color:'#B3B3B3'
          },
          grid:{
            color:'#222222'
          }
        },

        y:{
          ticks:{
            color:'#B3B3B3'
          },
          grid:{
            color:'#222222'
          }
        }

      }

    }

  });

}



function criarGraficoMarcas(dados){

  const ctx = document.getElementById('graficoMarcas');

  new Chart(ctx, {

    type:'doughnut',

    data:{
      labels:dados.labels,

      datasets:[{

        data:dados.valores,

        backgroundColor:[
          '#E10600',
          '#FF2B2B',
          '#991111',
          '#550000'
        ],

        borderWidth:0

      }]
    },

    options:{
      responsive:true,
      maintainAspectRatio:false,

      plugins:{
        legend:{
          labels:{
            color:'#FFFFFF'
          }
        }
      }

    }

  });

}


setInterval(() => {
  carregarDashboard();
}, 5000);

carregarDashboard();

</script>

</body>
</html>
