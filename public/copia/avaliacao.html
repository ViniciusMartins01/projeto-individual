<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avaliação | MotoRadar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0B0B0B;
    color:#FFFFFF;
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:650px;
}

.card{
    background:#161616;
    border:1px solid #1F1F1F;
    border-radius:24px;
    padding:45px;
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.logo{
    font-size:32px;
    font-weight:700;
    color:#E10600;
    margin-bottom:10px;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#B3B3B3;
    margin-bottom:40px;
    line-height:1.7;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:12px;
    color:#B3B3B3;
    font-size:15px;
}

input,
textarea,
select{
    width:100%;
    background:#0F0F0F;
    border:1px solid #222222;
    padding:16px;
    border-radius:14px;
    color:#FFFFFF;
    outline:none;
    transition:.3s;
    font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#E10600;
}

textarea{
    resize:none;
    height:140px;
}

.rating{
    display:flex;
    gap:15px;
    justify-content:center;
    margin:30px 0;
}

.star{
    width:65px;
    height:65px;
    border-radius:18px;
    background:#0F0F0F;
    border:1px solid #222222;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.3s;
    font-size:28px;
    color:#666666;
}

.star:hover{
    transform:translateY(-4px);
    border-color:#E10600;
}

.star.active{
    background:rgba(225,6,0,0.15);
    border-color:#E10600;
    color:#E10600;
    box-shadow:0 10px 20px rgba(225,6,0,0.2);
}

.btn{
    width:100%;
    background:linear-gradient(135deg,#E10600,#FF2B2B);
    border:none;
    padding:18px;
    border-radius:14px;
    color:#FFFFFF;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    font-size:16px;
    margin-top:10px;
}

.btn:hover{
    transform:translateY(-4px);
}

.resultado{
    margin-top:25px;
    text-align:center;
    color:#00d26a;
    font-weight:600;
    display:none;
}

@media(max-width:768px){

    .card{
        padding:30px;
    }

    .rating{
        gap:10px;
    }

    .star{
        width:55px;
        height:55px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            MotoRadar
        </div>

        <div class="subtitle">
            Avalie sua experiência utilizando a plataforma.
            Sua opinião ajuda a melhorar o projeto.
        </div>

        <div class="form-group">

            <label>Sua avaliação</label>

            <div class="rating">

                <div class="star" onclick="avaliar(1)">★</div>
                <div class="star" onclick="avaliar(2)">★</div>
                <div class="star" onclick="avaliar(3)">★</div>
                <div class="star" onclick="avaliar(4)">★</div>
                <div class="star" onclick="avaliar(5)">★</div>

            </div>

        </div>

        <div class="form-group">

            <label>Comentário</label>

            <textarea id="inputComentario" placeholder="Conte o que achou do sistema..."></textarea>

        </div>

        <button class="btn" onclick="enviarAvaliacao()">
            Enviar avaliação
        </button>

        <div class="resultado" id="resultado">
            Avaliação enviada com sucesso!
        </div>

    </div>

</div>

<script>

let notaSelecionada = 0;

function avaliar(nota){

    notaSelecionada = nota;

    const estrelas = document.querySelectorAll('.star');

    estrelas.forEach((estrela, index) => {

        estrela.classList.remove('active');

        if(index < nota){
            estrela.classList.add('active');
        }

    });

}

function enviarAvaliacao(){

    const nome = document.getElementById('inputNome').value;
    const comentario = document.getElementById('inputComentario').value;

    if(nome == '' || notaSelecionada == 0){

        alert('Preencha os campos corretamente');

        return;
    }

    console.log({
        nome,
        nota: notaSelecionada,
        comentario
    });

    document.getElementById('resultado').style.display = 'block';

}

</script>

</body>
</html>
