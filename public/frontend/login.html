<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-box">
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Senha">
    <button>Entrar</button>

    <h3>Cadastro</h3>
    <input type="text" placeholder="Nome" id="ipt_nome">
    <input type="email" placeholder="Email" id="ipt_email">
    <input type="password" placeholder="Senha" id="ipt_senha">
    <button onclick="cadastrar()">Cadastrar</button>
  </div>
</div>

</body>
</html>
<script>
  let nomes = [];
  let emails = [];
  let senhas = [];
function cadastrar() {
  let nome = ipt_nome.value;
  let email = ipt_email.value;
  let senha = ipt_senha.value;
  let caracteres = ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')', '-', '_', '=', '+', '[', ']', '{', '}', '|', ';', ':', '"', "'", '<', '>', ',', '.', '?', '/'];
  for (let i = 0; i < caracteres.length; i++) {
    if (senha.includes(caracteres[i])) {
      alert('A senha não pode conter caracteres especiais.');
      break;
    }
  }
   if (nome == '' || email == '' || senha == ''  || senha.length < 6) {
    alert('Por favor, preencha todos os campos e verifique o comprimento da senha.');
  } else{
    nomes.push(nome);
    emails.push(email);
    senhas.push(senha);
    alert('Cadastro realizado com sucesso!');
  }

}
</script>
