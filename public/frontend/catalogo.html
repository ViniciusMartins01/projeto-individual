<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - MotoRadar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      font-family: Poppins, sans-serif;
      background: #0B0B0B;
      color: #fff;
      overflow-x:hidden;
    }

    header {
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      position: sticky;
      top: 0;
      z-index:1000;
      backdrop-filter:blur(10px);
    }

    .logo {
      color: #E10600;
      font-weight: 700;
      font-size: 28px;
    }

    nav a {
      color: #fff;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: #E10600;
    }

    .title {
      padding: 60px 8%;
      text-align: center;
    }

    .title h1 {
      font-size: 42px;
    }

    .title span {
      color: #E10600;
    }

    .grid {
      padding: 0 8% 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: #161616;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      border: 1px solid #E10600;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0;
      color: #fff;
    }

    .card-content p {
      color: #B3B3B3;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #E10600;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
    }

    .btn:hover {
      background: #FF2B2B;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">MotoRadar</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="login.html">Login</a>
      <a href="cadastro.html">Cadastro</a>
    </nav>
  </header>

  <section class="title">
    <h1>Nosso <span>Catálogo</span></h1>
    <p>Escolha sua próxima moto</p>
  </section>

  <section class="grid">
    <div class="card"><img src="./assets/r1.jpg">
      <div class="card-content">
        <h3>Yamaha R1</h3>
        <p>1000cc Esportiva</p><a class="btn" href="r1.html">Ver detalhes</a>
      </div>
    </div>
    <div class="card"><img src="./assets/cb500.jpeg">
      <div class="card-content">
        <h3>Honda CB500</h3>
        <p>500cc Naked</p><a class="btn" href="cb500.html">Ver detalhes</a>
      </div>
    </div>
    <div class="card"><img src="./assets/ninja600cc.webp">
      <div class="card-content">
        <h3>Kawasaki Ninja</h3>
        <p>636cc Esportiva</p><a class="btn" href="ninja600.html">Ver detalhes</a>
      </div>
    </div>
  </section>

</body>

</html>
