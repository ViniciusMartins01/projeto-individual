<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparador - MotoProject</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🏍️ MotoProject</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="#">Blog</a>
    <a href="comparador.html">Comparador</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<section class="catalog-header">
  <h2>Comparador de Motos</h2>
  <p>Compare duas motos lado a lado</p>
</section>

<section class="comparador">

  <div class="compare-card">
    <h3>Moto 1</h3>
    <select id="moto1"></select>
    <ul id="info1"></ul>
  </div>

  <div class="compare-card">
    <h3>Moto 2</h3>
    <select id="moto2"></select>
    <ul id="info2"></ul>
  </div>

</section>

<footer>
  <p>Projeto acadêmico</p>
</footer>

<script>
const motos = [
  { nome:"Yamaha R1", cilindrada:1000, tipo:"Esportiva", potencia:200, peso:200 },
  { nome:"Honda CB500", cilindrada:500, tipo:"Naked", potencia:50, peso:180 },
  { nome:"Kawasaki Ninja", cilindrada:636, tipo:"Esportiva", potencia:130, peso:190 }
];

const select1 = document.getElementById("moto1");
const select2 = document.getElementById("moto2");
const info1 = document.getElementById("info1");
const info2 = document.getElementById("info2");

function preencherSelects() {
  motos.forEach((m, i) => {
    select1.innerHTML += `<option value="${i}">${m.nome}</option>`;
    select2.innerHTML += `<option value="${i}">${m.nome}</option>`;
  });
}

function render() {
  const m1 = motos[select1.value];
  const m2 = motos[select2.value];

  info1.innerHTML = gerarLista(m1, m2);
  info2.innerHTML = gerarLista(m2, m1);
}

function gerarLista(m, comparada) {
  return `
    <li class="${m.cilindrada > comparada.cilindrada ? 'win':''}">Cilindrada: ${m.cilindrada}cc</li>
    <li class="${m.tipo === comparada.tipo ? '' : 'win'}">Tipo: ${m.tipo}</li>
    <li class="${m.potencia > comparada.potencia ? 'win':''}">Potência: ${m.potencia}cv</li>
    <li class="${m.peso < comparada.peso ? 'win':''}">Peso: ${m.peso}kg</li>
  `;
}

select1.addEventListener("change", render);
select2.addEventListener("change", render);

preencherSelects();
render();
</script>

</body>
</html>
