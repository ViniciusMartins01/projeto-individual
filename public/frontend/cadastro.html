<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoRadar - Cadastro</title>
  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

 
</head>
<body>

  <header>
    <a href="index.html" class="logo">MotoRadar</a>
  </header>

  <main class="register-wrapper">
    
    <div class="register-container">
      <div class="register-header">
        <h1>Crie sua <span>Conta</span></h1>
        <p>Faça parte do ecossistema MotoRadar.</p>
      </div>

      <form action="#">
        <div class="input-group">
          <label>Nome Completo</label>
          <input id="nome_input" type="text" placeholder="Ex: João da Silva" required>
        </div>

        <div class="input-group">
          <label>E-mail Acadêmico ou Pessoal</label>
          <input id="email_input" type="email" placeholder="seu@email.com" required>
        </div>

        <div class="input-group">
          <label>Defina uma Senha</label>
          <input type="password" placeholder="Mínimo 8 caracteres" required>
        </div>

        <div class="input-group">
          <label>Confirme sua Senha</label>
          <input type="password" placeholder="Repita a senha" required>
        </div>

        <button type="submit" class="btn-register">Finalizar Cadastro</button>
      </form>

      <div class="register-footer">
        Já tem uma conta no Radar? <a href="login.html">Faça Login aqui</a>
      </div>
    </div>

  </main>

  <footer>
    <p>© 2026 MotoRadar - Projeto acadêmico ADS</p>
  </footer>

</body>
</html>

<script>


  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var cpfVar = cpf_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == "" ||
      cpfVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else if (
      nomeVar.length <= 1 ||
      emailVar.includes("@") == false ||
      emailVar.includes(".") == false ||
      senhaVar.length <= 6 ||
      senhaVar != confirmacaoSenhaVar ||
      cpfVar.length != 11) {
        cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Nome deve conter mais de 1 caractere, email deve ser válido, senha deve conter mais de 6 caracteres e ser igual a confirmação, CPF deve conter 11 caracteres)";

      finalizarAguardar();
      return false;

    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        cpfServer: cpfVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
