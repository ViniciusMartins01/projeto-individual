<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Motos - MotoRadar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins', sans-serif;
  background:#0B0B0B;
  color:#FFFFFF;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  height:100vh;
  background:#111111;
  padding:30px;
  position:fixed;
  left:0;
  top:0;
  border-right:1px solid #1f1f1f;
}

.logo{
  font-size:28px;
  font-weight:700;
  color:#E10600;
  margin-bottom:50px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.menu a{
  text-decoration:none;
  color:#B3B3B3;
  padding:14px;
  border-radius:10px;
  transition:.3s;
}

.menu a:hover{
  background:#1A1A1A;
  color:#FFFFFF;
}

.menu .active{
  background:#E10600;
  color:#FFFFFF;
}

/* MAIN */

.main{
  margin-left:260px;
  width:100%;
  padding:40px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.topbar h1{
  font-size:36px;
}

.user{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#E10600;
}

/* FORM */

.form-container{
  background:#161616;
  padding:40px;
  border-radius:20px;
  max-width:900px;
  border:1px solid #1f1f1f;
}

.form-title{
  margin-bottom:30px;
}

.form-title h2{
  font-size:30px;
}

.form-title p{
  color:#B3B3B3;
  margin-top:5px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.input-group{
  display:flex;
  flex-direction:column;
}

.input-group label{
  margin-bottom:10px;
  color:#B3B3B3;
  font-size:15px;
}

.input-group input,
.input-group select{
  background:#0F0F0F;
  border:1px solid #222;
  padding:15px;
  border-radius:12px;
  color:#FFFFFF;
  outline:none;
  transition:.3s;
}

.input-group input:focus,
.input-group select:focus{
  border-color:#E10600;
}

.input-group input[type="file"]{
  padding:12px;
  cursor:pointer;
}

/* IMAGE PREVIEW */

.preview{
  margin-top:20px;
  width:100%;
  height:250px;
  border-radius:16px;
  border:2px dashed #333;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#0F0F0F;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* BUTTON */

.button-area{
  margin-top:30px;
}

.btn{
  background:linear-gradient(135deg,#E10600,#ff3b3b);
  border:none;
  padding:15px 25px;
  border-radius:12px;
  color:#FFFFFF;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 10px 20px rgba(225,6,0,0.25);
}

.btn:hover{
  transform:translateY(-3px);
}

/* RESPONSIVO */

@media(max-width:900px){

  .form-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">MotoRadar</div>

  <div class="menu">
    <a href="#">Dashboard</a>
    <a href="#" class="active">Cadastrar Moto</a>
    <a href="#">Catálogo</a>
    <a href="#">Comparador</a>
    <a href="#">Blog</a>
  </div>

</div>

<!-- MAIN -->

<div class="main">

  <!-- TOPBAR -->

  <div class="topbar">

    <h1>Cadastro de Motos</h1>

    <div class="user">
      <span>Vinicius</span>
      <div class="avatar"></div>
    </div>

  </div>

  <!-- FORM -->

  <div class="form-container">

    <div class="form-title">
      <h2>Nova Moto</h2>
      <p>Cadastre uma nova moto no catálogo.</p>
    </div>

    <form>

      <div class="form-grid">

        <!-- NOME -->

        <div class="input-group">
          <label>Nome da moto</label>
          <input type="text" placeholder="Ex: Yamaha R1">
        </div>

        <!-- MARCA -->

        <div class="input-group">
          <label>Marca</label>

          <select>
            <option>Selecione</option>
            <option>Honda</option>
            <option>Yamaha</option>
            <option>Kawasaki</option>
            <option>BMW</option>
            <option>Suzuki</option>
          </select>
        </div>

        <!-- CATEGORIA -->

        <div class="input-group">
          <label>Categoria</label>

          <select>
            <option>Selecione</option>
            <option>Esportiva</option>
            <option>Naked</option>
            <option>Adventure</option>
            <option>Custom</option>
            <option>Trail</option>
          </select>
        </div>

        <!-- CILINDRADA -->

        <div class="input-group">
          <label>Cilindrada</label>
          <input type="number" placeholder="Ex: 1000">
        </div>

        <!-- PREÇO -->

        <div class="input-group">
          <label>Preço</label>
          <input type="number" placeholder="Ex: 85000">
        </div>

        <!-- FOTO -->

        <div class="input-group">
          <label>Foto da moto</label>
          <input type="file" id="fotoInput" accept="image/*">
        </div>

      </div>

      <!-- PREVIEW -->

      <div class="preview" id="preview">
        <span style="color:#555;">Pré-visualização da imagem</span>
      </div>

      <!-- BUTTON -->

      <div class="button-area">
        <button type="submit" class="btn">
          Cadastrar Moto
        </button>
      </div>

    </form>

  </div>

</div>

<script>

/* PREVIEW IMAGEM */

const fotoInput = document.getElementById('fotoInput');
const preview = document.getElementById('preview');

fotoInput.addEventListener('change', function(){

  const file = this.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      preview.innerHTML = `
        <img src="${e.target.result}">
      `;

    }

    reader.readAsDataURL(file);

  }

});

</script>

</body>
</html>
