<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoByte | Avaliação</title>
    <script src="./js/alerta.js"></script>
    <script src="./js/sessao.js"></script>
    <link rel="icon" href="./assets/icon/icon-black.png" />
    <link rel="stylesheet" href="./css/dash.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="sidebar">
        <div class="logo">MotoByte</div>
        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="cadastrador.html">Cadastrar Motos</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="avaliacao.html" class="active">Avaliar</a>
            <a <button onclick="limparSessao()">Sair</button></a>
        </div>
    </div>
    <div class="content">
        <div class="topbar">
            <h1>Avaliação do Site</h1>
            <div class="user">
                Bem-vindo, <span id="b_usuario"> Usuário</span>
            </div>
        </div>
        <div class="container">
            <div class="card">
                <div class="subtitle">
                    Avalie sua experiência utilizando a plataforma.
                    Sua opinião ajuda a melhorar o projeto
                </div>
                <div class="form-group">
                    <label>Sua avaliação</label>
                    <div class="rating">
                        <div class="star" onclick="avaliar(1)">★</div>
                        <div class="star" onclick="avaliar(2)">★</div>
                        <div class="star" onclick="avaliar(3)">★</div>
                        <div class="star" onclick="avaliar(4)">★</div>
                        <div class="star" onclick="avaliar(5)">★</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Comentário</label>
                    <textarea id="ipt_comentario" placeholder="Conte o que achou do sistema..."></textarea>
                </div>
                <button class="btn-av" onclick="enviarAvaliacao()">
                    Enviar avaliação
                </button>
                <div class="resultado" id="resultado">
                    Avaliação enviada com sucesso!
                </div>
            </div>
        </div>
</body>

</html>
<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let notaSelecionada = 0;


    function avaliar(nota) {
        notaSelecionada = nota;
        const estrelas = document.querySelectorAll('.star');
        estrelas.forEach((estrela, index) => {
            estrela.classList.remove('active');
            if (index < nota) {
                estrela.classList.add('active');
            }
        });

    }

    function enviarAvaliacao() {
        let comentario = ipt_comentario.value;
        if (notaSelecionada == "" || comentario == "") {
            resultado.style.display = 'block';
            resultado.style.color = "red";
            resultado.style.backgroundColor = "black"
            resultado.style.padding = "15px"
            resultado.innerHTML = 'Preencha os 2 campos!'
        } else {
            fetch("/avaliacoes/inserir", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    notaServer: notaSelecionada,
                    comentarioServer: comentario
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        resultado.style.display = "block";

                        setTimeout(() => {
                            window.location = "dashboard.html";
                        }, "2000");

                    } else {
                        throw "Houve um erro ao tentar realizar o cadastro!";
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }

    }






</script>
