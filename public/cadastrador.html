<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Motos - MotoRadar</title>
<link rel="icon" href="./assets/icon/icon-black.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="./css/cadastrar.css">
<script src="./js/sessao.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>


<div class="sidebar">

  <div class="logo">MotoRadar</div>

  <div class="menu">
    <a href="dashboard.html">Dashboard</a>
    <a href="cadastrador.html" class="active">Cadastrar Moto</a>
    <a href="catalogo.html">Catálogo</a>
    <a <button onclick="limparSessao()">Sair</button></a>
  </div>

</div>

<div class="main">
  <div class="topbar">
    <h1>Cadastro de Motos</h1>
      <div class="user">
      Bem-vindo, <span id="b_usuario"> Usuário</span>
    </div>
    

  </div>
  <div class="form-container">

    <div class="form-title">
      <h2>Nova Moto</h2>
      <p>Cadastre uma nova moto no catálogo.</p>
    </div>

    <form>

      <div class="form-grid">
        <div class="input-group">
          <label>Nome da moto</label>
          <input type="text" placeholder="Ex: Yamaha R1">
        </div>

        <div class="input-group">
          <label>Marca</label>

          <select>
            <option>Selecione</option>
            <option>Honda</option>
            <option>Yamaha</option>
            <option>Kawasaki</option>
            <option>BMW</option>
            <option>Suzuki</option>
            <option>Bajaj</option>
            <option>Shineray</option>
            <option>Dafra</option>
          </select>
        </div>

        <div class="input-group">
          <label>Categoria</label>

          <select>
            <option>Selecione</option>
            <option>Esportiva</option>
            <option>Naked</option>
            <option>Adventure</option>
            <option>Custom</option>
            <option>Trail</option>
            <option>Street</option>
          </select>
        </div>


        <div class="input-group">
          <label>Cilindrada</label>
          <input type="number" placeholder="Ex: 1000">
        </div>


        <div class="input-group">
          <label>Preço</label>
          <input type="number" placeholder="Ex: 85000">
        </div>


        <div class="input-group">
          <label>Foto da moto</label>
          <input type="file" id="fotoInput" accept="image/*">
        </div>

      </div>


      <div class="preview" id="preview">
        <span style="color:#555;">Pré-visualização da imagem</span>
      </div>


      <div class="button-area">
        <button type="submit" class="btn">
          Cadastrar Moto
        </button>
      </div>

    </form>

  </div>

</div>

<script>
b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

const fotoInput = document.getElementById('fotoInput');
const preview = document.getElementById('preview');

fotoInput.addEventListener('change', function(){

  const file = this.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){

      preview.innerHTML = `
        <img src="${e.target.result}">
      `;

    }

    reader.readAsDataURL(file);

  }

});

</script>

</body>
</html>
